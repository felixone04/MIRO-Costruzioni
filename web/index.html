<!DOCTYPE html>
<html lang="it">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="M.I.R.O. Costruzioni, impresa edile a Bari dal 1987: nuove costruzioni, ristrutturazioni e restauri. Guarda i progetti realizzati.">
  <meta name="theme-color" content="#F4EEE4">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="M.I.R.O.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>M.I.R.O. Costruzioni · Impresa edile a Bari</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=DM+Sans:wght@500&display=swap" rel="stylesheet">

  <style>
    html, body { margin: 0; height: 100%; background: #F4EEE4; }
    /* Logo d'apertura: il simbolo si disegna, poi tutto sfuma. */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #F4EEE4; color: #3B2B27; padding: 0 32px;
      transition: opacity .8s ease, visibility .8s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; }
    #splash .row { display: flex; align-items: center; gap: 16px; }
    #splash svg { width: clamp(52px, 12vw, 70px); height: auto; }
    #splash svg rect { transform-origin: center; transform: scale(0); animation: pop .6s cubic-bezier(.2,.8,.2,1) .05s forwards; }
    #splash svg path { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1s ease .35s forwards; }
    #splash .name {
      font-family: 'Fraunces', Georgia, serif; font-weight: 500;
      font-size: clamp(34px, 9vw, 54px); line-height: 1;
      opacity: 0; transform: translateX(-8px); animation: show .9s cubic-bezier(.2,.7,.2,1) .45s forwards;
    }
    #splash .name small {
      display: block; margin-top: 6px; font-family: 'DM Sans', Arial, sans-serif; font-weight: 500;
      font-size: clamp(12px, 3vw, 15px); color: rgba(59,43,39,.65);
    }
    #splash .bar { width: min(180px, 46vw); height: 3px; border-radius: 3px; margin-top: 38px; background: rgba(59,43,39,.12); overflow: hidden; }
    #splash .bar b { display: block; height: 100%; background: #CD5C5C; border-radius: 3px; transform-origin: left; transform: scaleX(0); animation: fill 1.6s ease-in-out forwards; }
    @keyframes show { to { opacity: 1; transform: none; } }
    @keyframes pop { to { transform: scale(1); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fill { to { transform: scaleX(1); } }
  </style>

  <!-- Google Identity Services: serve per collegare Google Calendar dal gestionale -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="splash" aria-label="M.I.R.O. Costruzioni, caricamento">
    <div class="row">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="26" fill="#CD5C5C"/>
        <path d="M22 74 V47 L36 30 L50 47 L64 30 L78 47 V74 M50 62 V74" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div class="name">M.I.R.O.<small>Costruzioni</small></div>
    </div>
    <div class="bar"><b></b></div>
  </div>
  <script>
    (function () {
      var start = Date.now();
      var MIN_MS = 1100; // durata minima del logo d'apertura
      window.addEventListener('flutter-first-frame', function () {
        var wait = Math.max(0, MIN_MS - (Date.now() - start));
        setTimeout(function () {
          var s = document.getElementById('splash');
          if (!s) return;
          s.classList.add('hide');
          setTimeout(function () { s.remove(); }, 900);
        }, wait);
      });
    })();
  </script>
  <script>
    // L'avvio si scarica sempre nuovo (è piccolo): GitHub Pages lo terrebbe
    // in memoria per 10 minuti, mostrando la versione precedente.
    (function () {
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?t=' + Date.now();
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
