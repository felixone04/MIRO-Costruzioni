name: miro_costruzioni
description: "M.I.R.O. Costruzioni: sito vetrina dei progetti con gestionale (Flutter Web)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^18.0.2
  # La 9.x dipende da material_ui ed è incompatibile con Flutter 3.47.
  google_fonts: 8.0.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  http: ^1.6.0
  image_picker: ^1.2.4
  crypto: ^3.0.7
  url_launcher: ^6.3.3
  visibility_detector: ^0.4.0+2
  file_picker: ^13.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
